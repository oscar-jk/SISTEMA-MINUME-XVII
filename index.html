<!doctype html>
<html lang="es-DO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SIRIO XVII · Entrar</title>
  <meta name="description" content="SIRIO XVII — sistema de gestión de MINUME XVII, edición de Estrellas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/componentes.css" />
  <link rel="stylesheet" href="/css/vistas.css" />
</head>
<body>
  <div class="pantalla-login">
    <div class="pantalla-login__tarjeta">
      <p class="pantalla-login__marca">SIRIO <span>XVII</span></p>
      <p class="pantalla-login__subtitulo">MINUME XVII · Edición de Estrellas</p>
      <form id="form-login" class="formulario">
        <label class="campo">
          <span>Correo</span>
          <input type="email" name="correo" required autocomplete="username" />
        </label>
        <label class="campo">
          <span>Código de acceso</span>
          <input type="password" name="codigo" required autocomplete="current-password" />
        </label>
        <p id="login-error" class="texto-danger texto-pequeno" hidden></p>
        <button type="submit" class="boton boton--primario boton--ancho">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/paginas/login.js"></script>
</body>
</html>
