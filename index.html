<!doctype html>
<html lang="es-DO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MINUME XVII · Estrellas</title>
  <meta name="description" content="Calendario y gestión de tareas del equipo organizador de MINUME XVII." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/componentes.css" />
  <link rel="stylesheet" href="/css/vistas.css" />
</head>
<body>
  <div id="banner-conexion" class="banner-conexion" hidden></div>

  <div id="pantalla-login" class="pantalla-login" hidden>
    <div class="pantalla-login__tarjeta">
      <p class="pantalla-login__marca">MINUME <span>XVII</span></p>
      <p class="pantalla-login__subtitulo">Edición de Estrellas · Calendario y tareas</p>
      <form id="form-login" class="formulario">
        <label class="campo">
          <span>Correo</span>
          <input type="email" name="correo" required autocomplete="username" />
        </label>
        <label class="campo">
          <span>Código de acceso</span>
          <input type="password" name="codigo" required autocomplete="current-password" />
        </label>
        <p id="login-error" class="texto-danger texto-pequeno" hidden></p>
        <button type="submit" class="boton boton--primario boton--ancho">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <header class="app-header">
      <div class="app-header__marca">MINUME <span>XVII</span></div>
      <nav class="app-nav" id="app-nav"></nav>
      <div class="app-header__usuario">
        <span id="app-usuario-nombre"></span>
        <button id="boton-salir" type="button" class="boton-icono" title="Cerrar sesión"></button>
      </div>
    </header>

    <nav class="app-nav-movil" id="app-nav-movil"></nav>

    <main id="app" class="app-contenido"></main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
